name: Desktop Release

on:
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            updater: darwin-aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            updater: darwin-x86_64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            updater: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecar placeholder
        run: pnpm desktop:prepare

      - name: Verify release sidecars
        if: ${{ vars.ALLOW_PLACEHOLDER_RUNTIME != 'true' }}
        run: pnpm desktop:verify-release-sidecars

      - name: Build web assets
        run: pnpm build

      - name: Build desktop bundle
        env:
          # Fill these in the release environment. Do not hardcode credentials.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LIPLO_UPDATER_TARGET: ${{ matrix.updater }}
        run: pnpm exec tauri build --target ${{ matrix.target }}
